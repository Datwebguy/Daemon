<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#3b1a8a"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <clipPath id="eye"><path d="M30 138 Q128 60 226 138 Q128 206 30 138Z"/></clipPath>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <!-- orbit: the daemon circling while you rest -->
  <circle cx="128" cy="138" r="104" fill="none" stroke="#ddd6fe" stroke-opacity=".34" stroke-width="3" stroke-dasharray="1 10" stroke-linecap="round"/>
  <circle cx="208" cy="71" r="8" fill="#fde68a"/><circle cx="208" cy="71" r="14" fill="#fde68a" fill-opacity=".22"/>
  <!-- eye -->
  <path d="M30 138 Q128 60 226 138 Q128 206 30 138Z" fill="#f5f3ff"/>
  <g clip-path="url(#eye)">
    <circle cx="128" cy="146" r="46" fill="url(#iris)"/>
    <!-- lightning pupil -->
    <path d="M136 108 L110 150 H127 L119 184 L148 138 H130 Z" fill="#2e1065"/>
    <!-- heavy lid: the sleepy half-close -->
    <path d="M18 60 H238 V128 Q128 112 18 128Z" fill="#5b2fc9"/>
    <path d="M30 128 Q128 112 226 128" fill="none" stroke="#1e0a4d" stroke-width="7" stroke-linecap="round"/>
  </g>
  <path d="M30 138 Q128 60 226 138 Q128 206 30 138Z" fill="none" stroke="#1e0a4d" stroke-width="7" stroke-linejoin="round"/>
</svg>
